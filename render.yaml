databases:
  - name: botxchange-db
    plan: free
    databaseName: botxchange
    user: botxchange

services:
  - type: web
    name: botxchange-backend
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npm run build && npx prisma db push
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: botxchange-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: CORS_ORIGINS
        sync: false
      - key: DELTA_API_BASE_URL
        value: https://api.india.delta.exchange
      - key: DELTA_TESTNET_BASE_URL
        value: https://cdn-ind.testnet.deltaex.org
